<!-- sidebar.html -->
<aside
    class="w-64 h-screen flex flex-col justify-between shrink-0 bg-[#f5f2eb] border-r border-black/5 sticky top-0 font-sans">
    <div>
        <!-- Cabeçalho Topo (Branco) -->
        <div class="bg-white px-6 py-5">
            <h1 class="text-xl font-bold text-[#8c5a3e] tracking-tight">DoceGestão</h1>
        </div>

        <!-- Conteúdo do Menu (Fundo Bege) -->
        <div class="px-5 pt-5 space-y-5">

            <!-- Subtítulo -->
            <div class="px-2">
                <h2 class="text-sm font-bold text-[#8c5a3e]">Confeitaria</h2>
                <p class="text-xs text-[#64748b] font-medium">Gestão Premium</p>
            </div>

            <!-- Navegação Principal -->
            <nav class="space-y-1 text-sm font-semibold text-[#334155]">

                <!-- Dashboard -->
                <a href="#" data-page="dashboard"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </a>

                <!-- Estoque -->
                <a href="#" data-page="estoque"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="package" class="w-5 h-5"></i>
                    <span>Estoque</span>
                </a>

                <!-- Entrada -->
                <a href="#" data-page="entrada"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span>Entrada</span>
                </a>

                <!-- Saída -->
                <a href="#" data-page="saida"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>Saída</span>
                </a>

                <!-- Alertas -->
                <a href="#" data-page="alertas"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span>Alertas</span>
                </a>

                <!-- Histórico (Com Submenu) -->
                <div>
                    <button type="button" id="btn-historico" data-page="historico"
                        class="flex w-full items-center justify-between px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all cursor-pointer">
                        <div class="flex items-center gap-3">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                            <span>Histórico</span>
                        </div>
                        <i data-lucide="chevron-down" id="seta-historico"
                            class="w-4 h-4 transition-transform duration-200"></i>
                    </button>

                    <!-- SUBMENU -->
                    <div id="submenu-historico" class="pl-10 pr-2 pt-1 space-y-1" style="display: none;">
                        <a href="#" data-page="historico-movimentacoes"
                            class="block px-3 py-2 rounded-lg text-xs font-semibold text-[#475569] hover:bg-black/5 transition-all">
                            Movimentações
                        </a>
                        <a href="#" data-page="historico-materia-prima"
                            class="block px-3 py-2 rounded-lg text-xs font-semibold text-[#475569] hover:bg-black/5 transition-all">
                            Matéria Prima
                        </a>
                    </div>
                </div>

                <!-- Funcionários -->
                <a href="#" data-page="funcionarios"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span>Funcionários</span>
                </a>

                <!-- Admin -->
                <a href="#" data-page="admin"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-black/5 transition-all">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                    <span>Admin</span>
                </a>

            </nav>
        </div>
    </div>

    <!-- Rodapé: Botão Novo Item -->
    <div class="p-5">
        <button type="button" id="btn-novo-sidebar"
            class="w-full bg-[#8c5a3e] hover:bg-[#784c33] text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-sm cursor-pointer text-sm">
            <a href="#">
                <span class="text-base font-normal">+</span>
                <span>Novo Item</span>
            </a>
        </button>
    </div>
</aside>
