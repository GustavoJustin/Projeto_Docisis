<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3A2A1A" />
    <title>DoceGestão | Criar conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/output.css" />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-cream px-4 py-8 text-cocoa-800">
    <main class="mx-auto w-full max-w-xl">
      <a
        href="painel.html?pagina=login"
        class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-cocoa-700 hover:text-cocoa-900"
      >
        <span aria-hidden="true">&larr;</span>
        Voltar ao login
      </a>

      <section class="rounded-2xl border border-cocoa-200 bg-white p-6 shadow-xl shadow-cocoa-800/5 sm:p-8">
        <div class="mb-7">
          <p class="font-display text-sm font-semibold uppercase tracking-wider text-cocoa-500">DoceGestão</p>
          <h1 class="mt-2 font-display text-3xl font-bold text-cocoa-800">Criar conta de funcionário</h1>
          <p class="mt-2 text-sm text-cocoa-500">
            Preencha seus dados para solicitar acesso ao sistema.
          </p>
        </div>

        <form id="form-cadastro" data-cadastro-publico="true" novalidate class="space-y-5">
          <div
            id="cadastro-alert"
            class="hidden rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800"
            role="alert"
            aria-live="polite"
          >
            <span id="cadastro-alert-text"></span>
          </div>

          <div>
            <label for="input-nome" class="mb-1.5 block text-sm font-semibold">Nome completo</label>
            <input
              type="text"
              id="input-nome"
              required
              autocomplete="name"
              placeholder="Ex.: Maria Oliveira"
              class="w-full rounded-xl border border-cocoa-200 bg-cream/40 px-4 py-3 text-sm placeholder:text-cocoa-400/70 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-cocoa-400"
            />
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="input-cpf" class="mb-1.5 block text-sm font-semibold">CPF</label>
              <input
                type="text"
                id="input-cpf"
                required
                minlength="14"
                maxlength="14"
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                autocomplete="off"
                placeholder="000.000.000-00"
                class="w-full rounded-xl border border-cocoa-200 bg-cream/40 px-4 py-3 text-sm placeholder:text-cocoa-400/70 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-cocoa-400"
              />
            </div>
            <div>
              <label for="input-email" class="mb-1.5 block text-sm font-semibold">E-mail</label>
              <input
                type="email"
                id="input-email"
                required
                autocomplete="email"
                placeholder="voce@exemplo.com"
                class="w-full rounded-xl border border-cocoa-200 bg-cream/40 px-4 py-3 text-sm placeholder:text-cocoa-400/70 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-cocoa-400"
              />
            </div>
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="input-senha" class="mb-1.5 block text-sm font-semibold">Senha</label>
              <input
                type="password"
                id="input-senha"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Mínimo de 6 caracteres"
                class="w-full rounded-xl border border-cocoa-200 bg-cream/40 px-4 py-3 text-sm placeholder:text-cocoa-400/70 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-cocoa-400"
              />
            </div>
            <div>
              <label for="input-confirma-senha" class="mb-1.5 block text-sm font-semibold">Confirmar senha</label>
              <input
                type="password"
                id="input-confirma-senha"
                required
                minlength="6"
                autocomplete="new-password"
                placeholder="Digite a senha novamente"
                class="w-full rounded-xl border border-cocoa-200 bg-cream/40 px-4 py-3 text-sm placeholder:text-cocoa-400/70 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-cocoa-400"
              />
            </div>
          </div>

          <div class="flex flex-col-reverse justify-center gap-3 border-t border-cocoa-100 pt-5 sm:flex-row">
            <a
              href="painel.html?pagina=login"
              class="min-w-36 rounded-xl border border-cocoa-200 px-5 py-3 text-center text-sm font-semibold text-cocoa-700 transition hover:bg-cream"
            >
              Cancelar
            </a>
            <button
              type="submit"
              class="min-w-36 rounded-xl bg-cocoa-700 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-cocoa-800 disabled:cursor-wait disabled:opacity-60"
            >
              Criar conta
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="../src/script/cadastroFuncionario.js" defer></script>
  </body>
</html>
