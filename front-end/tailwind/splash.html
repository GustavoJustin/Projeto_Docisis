<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3A2A1A" />
  <meta name="description" content="DoceGestão: gestão prática para sua confeitaria." />
  <title>Docisis — Carregando</title>

  <!-- Fontes usadas pelas páginas do projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Estilos e ícones compartilhados -->
  <link rel="stylesheet" href="../src/css/output.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Dependências específicas: copie e ative apenas as necessárias para a página. -->
</head>

<body class="min-h-screen bg-[#FAFAFA] text-[#4A3F39] flex">
  <div id="splash-decoration-top" aria-hidden="true"></div>
  <div id="splash-decoration-bottom" aria-hidden="true"></div>
  <main id="splash-content" aria-busy="true">
    <div id="splash-icon-circle" aria-hidden="true">
      <div id="splash-icon-square">
        <div id="splash-icon-diamond"></div>
      </div>
    </div>

    <h1 id="splash-title">Docisis</h1>
    <p id="splash-subtitle">GESTÃO DE ESTOQUE</p>

    <div id="splash-loading">
      <p id="splash-loading-text">Carregando seus dados…</p>
      <div id="splash-progress-track" role="progressbar" aria-label="Carregamento" aria-valuemin="0" aria-valuemax="100"
        aria-valuenow="0">
        <div id="splash-progress-bar"></div>
      </div>
    </div>
  </main>

  <script> lucide.createIcons(); </script>
  <script src="../src/script/splashScreen.js" defer></script>
</body>

</html>
